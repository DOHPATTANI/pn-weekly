name: Check and deploy PLANNET DOH
run-name: PLANNET DOH · ${{ github.event_name }} · ${{ github.sha }}
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run qa
      - run: npm run build

  supabase:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF || 'iiuearxdsbilcpsfzhyp' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Sync SQL migrations to Supabase
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api repos/${{ github.repository }}/commits/main --jq .sha)
          test "$latest" = "${{ github.sha }}" || { echo "Outdated database release"; exit 1; }
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "### ตรวจฐานที่อัปเดตผ่าน Supabase connector" >> $GITHUB_STEP_SUMMARY
            node tools.mjs verify-db
            exit 0
          fi
          mkdir -p supabase/migrations
          if [ ! -f supabase/config.toml ]; then
            printf 'project_id = "%s"\n' "$SUPABASE_PROJECT_REF" > supabase/config.toml
          fi
          # Normalize any Thai/Unicode characters in migration filenames for Supabase CLI compatibility while preserving 14-digit version key
          for f in supabase/migrations/*.sql; do
            [ -e "$f" ] || continue
            base=$(basename "$f" .sql)
            ver=$(echo "$base" | cut -d'_' -f1)
            rest=$(echo "$base" | cut -d'_' -f2-)
            safe=$(echo "$rest" | sed 's/[^a-zA-Z0-9_-]/_/g; s/__*/_/g; s/^_//; s/_$//')
            [ -n "$safe" ] || safe="migration"
            target="supabase/migrations/${ver}_${safe}.sql"
            if [ "$f" != "$target" ]; then
              mv "$f" "$target"
            fi
          done
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          # Never mark unknown migrations applied after an arbitrary SQL failure.
          supabase db push --include-all --password "$SUPABASE_DB_PASSWORD"
          node tools.mjs verify-db
          echo "### ✅ ซิงก์ฐานข้อมูล Supabase สำเร็จ ($SUPABASE_PROJECT_REF)" >> $GITHUB_STEP_SUMMARY

  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: [checks, supabase]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm run build
      - name: Reject outdated release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api repos/${{ github.repository }}/commits/main --jq .sha)
          test "$latest" = "${{ github.sha }}" || { echo "Outdated release. Start a new workflow on main instead of rerunning an old release."; exit 1; }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
